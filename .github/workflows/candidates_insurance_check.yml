name: Candidates.json insurance check

# Coworkのスケジュールタスク(8:15頃、candidates.jsonを生成・コミットする想定)が
# 何らかの理由で失敗した/実行されなかった場合の保険。本日分のcandidates.jsonが
# 更新されていなければジョブを失敗させ、GitHubの標準のワークフロー失敗通知
# (リポジトリの通知設定に従ってメール等が届く)で気付けるようにする。
# 新たにメール送信を組み込みたい場合は、このジョブの失敗をトリガーに
# dawidd6/action-send-mail 等を追加すればよい。

on:
  schedule:
    # 毎日 00:03 UTC = 9:03 JST に実行(Coworkの8:15タスクの後)
    # 分=0だと毎時ちょうどの実行集中で数時間遅延するリスクがあるため、数分ずらしている
    # (evening_results.yml/evening_results_retry.ymlと同じ対策)。
    - cron: "3 0 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # candidates.jsonの最終コミット日時を見るため全履歴を取得

      - name: Check candidates.json was updated today (JST)
        run: |
          TODAY_JST=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          if [ ! -f data/latest/candidates.json ]; then
            echo "::error::data/latest/candidates.json が存在しません(Coworkタスクが実行されていない可能性)"
            exit 1
          fi
          LAST_COMMIT_DATE=$(TZ='Asia/Tokyo' git log -1 --date=format-local:%Y-%m-%d --format=%cd -- data/latest/candidates.json)
          echo "本日(JST): $TODAY_JST / data/latest/candidates.json最終更新(JST): $LAST_COMMIT_DATE"
          if [ "$LAST_COMMIT_DATE" != "$TODAY_JST" ]; then
            echo "::error::data/latest/candidates.json が本日($TODAY_JST)更新されていません(最終更新: $LAST_COMMIT_DATE)。Coworkの候補選定タスクをご確認ください。"
            exit 1
          fi
          # コミット日だけでなく、中身の"date"が本日(JST)であることも確認する。
          # 2026-10-29〜11-24は出走表の取得が8:15に間に合わず、Routineが前日の出走表から
          # 「前日付けの候補」を毎朝コミットしていたが、コミット日は今日なのでこのチェックを
          # すり抜け、約4週間気付けなかった(中身の日付が前日=すでに終了したレース)。
          CONTENT_DATE=$(python3 -c "import json;print(json.load(open('data/latest/candidates.json',encoding='utf-8')).get('date',''))")
          echo "candidates.jsonの中身のdate: $CONTENT_DATE"
          if [ "$CONTENT_DATE" != "$TODAY_JST" ]; then
            echo "::error::candidates.jsonの中身のdate($CONTENT_DATE)が本日($TODAY_JST)ではありません。すでに終了したレースの候補の可能性があります(本日の出走表が8:15までに取得できていない=morning_programの遅れ/データ源の公開遅れが疑わしい)。"
            exit 1
          fi
          echo "OK: data/latest/candidates.json は本日分の内容で更新されています"

name: Odds fetch (締切10分前のオッズ取得)

# 候補レース(SS/S/A)の締切10分前ごろ(締切の5〜15分前)に、公式サイトの一般公開オッズページから
# 2連単/2連複/3連単/3連複のオッズを取得し、data/latest/odds/{日付}_{場}_{R}.csv に保存する。
# 取得したオッズの利用(買い目・掛け金の補正)は未実装。詳細は scripts/fetch_odds.py の冒頭を参照。
#
# 時刻の扱い(すべてJST基準):
#   - cronはUTC指定。下記2行で JST 8:04〜21:59 の間、5分おき(分は4,9,14,...。毎時0分ちょうどは
#     GitHub側が混雑しやすく数時間遅延した実績があるため避け、deadline_reminder.yml(2,7,12,...)
#     ともずらしている)。
#       "4-59/5 23 * * *"   = UTC 23時台 = 翌日JST 8時台
#       "4-59/5 0-12 * * *" = UTC 0〜12時台 = JST 9〜21時台
#     (依頼の `*/5 * * * *` から、レースの無い深夜帯の空振りをなくすために時間帯を絞っている)
#   - スクリプト側は zoneinfo の Asia/Tokyo で現在時刻を取る(ランナーはUTC)。
#
# 取得済みフラグ = 出力CSVの有無(ステートレスなので)。403/429を受けたらスクリプトは即停止して
# 失敗扱いになるが、それまでに取得できたCSVはコミットする(if: always())。
#
# race_key指定によるピンポイント起動(2026-09-28追加、deadline_reminder.ymlのPR #3と同じ考え方):
# 5分おきcronはGitHub Actions側の間引きでほとんど発火しないため(docs/STATUS.md参照)、外部
# スケジューラからworkflow_dispatchでrace_keyを指定すると、締切5〜15分前かどうかの時間窓判定を
# 一切行わず、そのレース1件分のオッズだけを即座に取得する。取得できたか(=このrace_key呼び出しが
# 成功したか)は終了コードで判別できる(0=成功、1=アクセス拒否、2=それ以外の失敗。詳細は
# scripts/fetch_odds.py冒頭参照)。ランク(SS/S/A)対象外の制限はrace_key指定時も従来通り適用する。
# 既存の5分おきcron(全候補スキャン)はそのまま並行稼働させる(新方式が安定するまでの保険)。

on:
  schedule:
    - cron: "4-59/5 23 * * *"
    - cron: "4-59/5 0-12 * * *"
  workflow_dispatch:
    inputs:
      simulate_now:
        description: "テスト用: この時刻(JST、例 2026-09-19 10:35:00)を現在時刻として判定する(実際にオッズを取得しCSVをコミットするので、締切後の値が保存される点に注意)"
        required: false
        default: ""
      race_key:
        description: "指定したレースだけを時間窓判定なしで即時取得する(例: 17-7 = 場コード17・7R)。空なら通常のcronと同じ全候補スキャン"
        required: false
        default: ""

concurrency:
  group: odds-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tzdata (zoneinfo Asia/Tokyo)
        run: pip install tzdata

      - name: Fetch odds for candidates about to close
        working-directory: scripts
        env:
          FETCH_ODDS_NOW: ${{ inputs.simulate_now }}
          FETCH_ODDS_RACE_KEY: ${{ inputs.race_key }}
        run: python fetch_odds.py

      - name: Commit and push new odds files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest/odds
          if ! git diff --cached --quiet; then
            git commit -m "Odds fetch $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M') JST"
            bash scripts/git_push_with_retry.sh
          else
            echo "No new odds files to commit"
          fi

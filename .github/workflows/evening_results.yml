name: Evening results fetch & retrain

on:
  schedule:
    # 毎日 13:00 UTC = 22:00 JST に実行(その日のレースが出そろっている時間帯)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's results and rebuild stats
        working-directory: scripts
        run: |
          python fetch_results.py
          python build_stats.py

      - name: Evaluate today's predictions (振り返り)
        working-directory: scripts
        run: python evaluate.py

      - name: Retrain model on accumulated data (学習)
        working-directory: scripts
        run: python train_model.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Evening results fetch & retrain $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi

name: Evening results fetch & retrain

on:
  schedule:
    # 毎日 13:03 UTC = 22:03 JST に実行(その日のレースが出そろっている時間帯)。
    # 分を0以外にずらしているのは、GitHub Actionsの公式ドキュメントで
    # 「毎時ちょうど(分=0)はスケジュール実行の混雑が最も起きやすい」と
    # 明記されているため(実際に2026-09-17、初回実行が約4.5時間遅延する
    # 事象を確認済み)。
    - cron: "3 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's results and rebuild stats
        working-directory: scripts
        run: |
          python fetch_results.py
          python build_stats.py

      - name: Evaluate today's predictions (振り返り)
        working-directory: scripts
        run: python evaluate.py

      - name: Retrain model on accumulated data (学習)
        working-directory: scripts
        run: python train_model.py

      - name: Evaluate today's candidates (的中率・回収率の集計)
        working-directory: scripts
        run: python evaluate_candidates.py

      - name: Generate bet suggestions for today's candidates (rank/budget/bets)
        working-directory: scripts
        run: python generate_bets.py

      - name: Evaluate today's ranked bets (実際の買い目ベースの収支)
        working-directory: scripts
        run: python evaluate_bets.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          # generate_bets.pyがこのジョブ内でdata/candidates.jsonを書き換えている場合、
          # それはevaluate_bets.pyが使うための一時的なものでコミットはしない
          # (candidates_notify.ymlがdata/candidates.jsonへのpushをトリガーにしているため、
          # ここでコミットすると自分自身を再度トリガーしてしまい、朝の候補メールが
          # 深夜に二重送信されてしまう)。
          git restore --staged data/candidates.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Evening results fetch & retrain $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Send candidate evaluation email
        if: hashFiles('candidates_evaluation_report.txt') != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【ボートレース予想】候補レース振り返り"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "boatrace-predictor <${{ secrets.GMAIL_USERNAME }}>"
          body: file://candidates_evaluation_report.txt

      - name: Send bets P&L email
        if: hashFiles('bets_evaluation_report.txt') != ''
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "【ボートレース予想】本日の収支"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: "boatrace-predictor <${{ secrets.GMAIL_USERNAME }}>"
          body: file://bets_evaluation_report.txt

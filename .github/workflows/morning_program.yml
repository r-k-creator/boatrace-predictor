name: Morning program fetch & predict

on:
  schedule:
    # 毎日 23:00 UTC = 8:00 JST に実行(Coworkの候補選定タスク8:15より前に終わらせる)
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's program and predict
        working-directory: scripts
        run: |
          python fetch_program.py
          python predict.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data predictions
          if ! git diff --cached --quiet; then
            git commit -m "Morning program fetch & predict $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
